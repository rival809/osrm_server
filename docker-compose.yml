version: "3.8"

services:
  # Tile Server - Generates tiles from PBF file
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: osrm-tileserver
    ports:
      - "8000:8080"
    volumes:
      - ./data:/data:ro
      - ./tileserver-config:/config
    environment:
      - VERBOSE=1
    command: >
      --verbose
      --port 8080
      --mbtiles /data/java.mbtiles
    restart: unless-stopped
    networks:
      - osrm-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # OSRM Backend - Routing engine
  osrm-backend:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data:ro
    command: >
      osrm-routed
      --algorithm mld
      --max-table-size 10000
      /data/java-latest.osrm
    restart: unless-stopped
    networks:
      - osrm-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:5000/route/v1/driving/107.6,-6.9;107.6,-6.9",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # OSRM Tile Service - Lightweight Proxy
  osrm-tile-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrm-tile-service
    ports:
      - "81:81"
    environment:
      - NODE_ENV=production
      - PORT=81
      - OSRM_URL=http://osrm-backend:5000
      - TILE_SERVER_URL=http://tileserver:8080/styles/basic-preview
      - MAX_MEMORY_MB=2000
      - LOG_LEVEL=info
    depends_on:
      - tileserver
      - osrm-backend
    restart: unless-stopped
    networks:
      - osrm-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:81/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  osrm-network:
    driver: bridge
